{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Registrace</title>
    <!-- Nastavení meta tagů a základní styl -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> <!-- Pro případný externí styl -->
</head>
<body>
    <!-- Nadpis stránky -->
    <h1>Registrace</h1>

    <!-- Formulář pro registraci -->
    <form method="post">
        {% csrf_token %} <!-- Ochrana proti CSRF útokům -->
        {{ form.as_p }} <!-- Automatické vykreslení polí formuláře jako odstavce -->
        <button type="submit">Zaregistrovat</button> <!-- Tlačítko pro odeslání -->
    </form>

    <!-- Odkaz na přihlášení -->
    <p>Máte již účet? <a href="{% url 'login' %}">Přihlásit se</a></p>
</body>
</html>
