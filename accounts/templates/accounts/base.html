<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hotel Management System - spravujte pokoje, rezervace, události a sklad snadno a efektivně.">
    <meta name="author" content="Váš Tým">
    <meta name="keywords" content="hotel, management, rezervace, pokoje, události, sklad">
    <title>{% block title %}Hotel Management System{% endblock %}</title>
    
    <!-- Načtení vlastního CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}">
    
    <!-- FontAwesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigační lišta -->
    <nav>
        <ul class="nav">
            <li class="nav-item"><a href="/" class="nav-link"><i class="fas fa-home"></i> Domů</a></li>
            <li class="nav-item"><a href="/rooms/" class="nav-link"><i class="fas fa-bed"></i> Pokoje</a></li>
            <li class="nav-item"><a href="/bookings/" class="nav-link"><i class="fas fa-calendar-check"></i> Rezervace</a></li>
            <li class="nav-item"><a href="/events/" class="nav-link"><i class="fas fa-calendar-alt"></i> Události</a></li>
            <li class="nav-item"><a href="/storage/" class="nav-link"><i class="fas fa-box"></i> Sklad</a></li>
            <li class="nav-item"><a href="/logout/" class="nav-link"><i class="fas fa-sign-out-alt"></i> Odhlásit</a></li>
        </ul>
    </nav>
    
    <!-- Hlavní obsah -->
    <main>
        {% block content %}
        <!-- Dynamický obsah stránky bude vložen zde -->
        {% endblock %}
    </main>
    
    <!-- Video na pozadí -->
    <div class="video-container">
        <video autoplay loop muted playsinline>
            <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
            Váš prohlížeč nepodporuje přehrávání videí.
        </video>
        <div class="video-overlay">
            <!-- Překryvný obsah, pokud je potřeba -->
        </div>
    </div>
    
    <!-- Patička -->
    <footer class="footer">
        <p>&copy; 2024 Hotel Management System. Všechna práva vyhrazena.</p>
        <a href="https://example.com/privacy-policy">Zásady ochrany osobních údajů</a>
    </footer>
    
    <!-- Načtení externích JavaScript souborů -->
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
