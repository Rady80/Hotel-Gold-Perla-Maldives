<!DOCTYPE html>
<html lang="cs">
<head>
    <!-- Metadata stránky -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hotel Management System - spravujte pokoje, rezervace, události a sklad snadno a efektivně.">
    <meta name="author" content="Váš Tým">
    <meta name="keywords" content="hotel, management, rezervace, pokoje, události, sklad">

    <!-- Dynamický blok pro název stránky -->
    <title>{% block title %}Hotel Management System{% endblock %}</title>
    
    <!-- Načtení externích CSS souborů -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Načtení vlastních CSS souborů -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}">
</head>
<body>
    <!-- Navigační lišta -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Hotel Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Přepnout navigaci">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/" class="nav-link"><i class="fas fa-home"></i> Domů</a></li>
                    <li class="nav-item"><a href="/rooms/" class="nav-link"><i class="fas fa-bed"></i> Pokoje</a></li>
                    <li class="nav-item"><a href="/bookings/" class="nav-link"><i class="fas fa-calendar-check"></i> Rezervace</a></li>
                    <li class="nav-item"><a href="/events/" class="nav-link"><i class="fas fa-calendar-alt"></i> Události</a></li>
                    <li class="nav-item"><a href="/storage/" class="nav-link"><i class="fas fa-box"></i> Sklad</a></li>
                    <li class="nav-item"><a href="/logout/" class="nav-link"><i class="fas fa-sign-out-alt"></i> Odhlásit</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Hlavní obsah stránky -->
    <div class="container mt-4">
        {% block content %}
        <!-- Dynamický obsah bude vložen zde z děděných šablon -->
        {% endblock %}
    </div>

    <!-- Video na pozadí (volitelné) -->
    <div class="video-container">
        <video autoplay loop muted playsinline>
            <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
            Váš prohlížeč nepodporuje přehrávání videí.
        </video>
        <div class="video-overlay">
            <!-- Překryvný obsah, pokud je potřeba -->
        </div>
    </div>
    
    <!-- Patička stránky -->
    <footer class="footer bg-dark text-white text-center py-3">
        <p>&copy; 2024 Hotel Management System. Všechna práva vyhrazena.</p>
        <a href="https://example.com/privacy-policy" class="text-decoration-none text-light">Zásady ochrany osobních údajů</a>
    </footer>
    
    <!-- Načtení externích JavaScript souborů -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
