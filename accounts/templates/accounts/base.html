<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hotel Management System{% endblock %}</title>
    
    <!-- Vlastní CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}">
    
    <!-- FontAwesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigace -->
    <nav>
        <ul class="nav">
            <li class="nav-item"><a href="/">Domů</a></li>
            <li class="nav-item"><a href="/rooms/">Pokoje</a></li>
            <li class="nav-item"><a href="/bookings/">Rezervace</a></li>
            <li class="nav-item"><a href="/events/">Události</a></li>
            <li class="nav-item"><a href="/storage/">Sklad</a></li>
            <li class="nav-item"><a href="/logout/">Odhlásit</a></li>
        </ul>
    </nav>
    
    <!-- Hlavní obsah -->
    <main>
        {% block content %}
        <!-- Obsah stránky -->
        {% endblock %}
    </main>
    
    <!-- Paticka -->
    <footer class="footer">
        <p>&copy; 2024 Hotel Management System. Všechna práva vyhrazena.</p>
    </footer>
</body>
</html>
