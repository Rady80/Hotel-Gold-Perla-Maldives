{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
        integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-image: url("{% static '/images/hotel.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
        }

        .container-center {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user_card {
            width: 300px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #98FB98; /* Pastelově zelená */
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form_container {
            margin-top: 15px;
        }

        .login_btn {
            width: 50%;
            padding: 5px;
            font-size: 14px;
            background: #00FF7F !important; /* Zelená barva */
            color: Black !important;
            transition: background-color 0.3s ease-in-out;
            border-radius: 5px;
        }

        .login_btn:hover {
            background-color: #32CD32 !important; /* Tmavší zelená při hoveru */
            color: #ffffff !important;
        }

        .input-group-text {
            background: #007FFF !important; /* Modrá barva */
            color: #ffffff !important; /* Bílý text */
            border: 0 !important;
            border-radius: 0.25rem 0 0 0.25rem !important;
        }

        .input_user,
        .input_pass:focus {
            box-shadow: 0px 4px 8px rgba(0, 123, 255, 0.5); /* Modrý stín při focusu */
            outline: none !important;
        }

        .toggle-password {
            cursor: pointer;
            color: #000; /* Černá barva oka */
        }

        .toggle-password:hover {
            color: #555; /* Tmavší šedá při hoveru */
        }

        .music-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            align-items: center;
        }

        .music-controls button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .music-controls button:hover {
            background-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .music-controls i {
            color: #000;
            font-size: 18px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 5px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("passwordInput");
            const toggleIcon = document.getElementById("togglePasswordIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }

        let audioPlaying = false;

        // Přepínání přehrávání a pauzy
        function toggleAudio() {
            const audioElement = document.getElementById("backgroundAudio");
            const musicIcon = document.getElementById("musicIcon");

            if (audioPlaying) {
                audioElement.pause();
                musicIcon.classList.remove("fa-pause");
                musicIcon.classList.add("fa-play");
            } else {
                audioElement.play();
                musicIcon.classList.remove("fa-play");
                musicIcon.classList.add("fa-pause");
            }

            audioPlaying = !audioPlaying;
        }

        // Zastavení hudby
        function stopAudio() {
            const audioElement = document.getElementById("backgroundAudio");
            const musicIcon = document.getElementById("musicIcon");

            audioElement.pause();
            audioElement.currentTime = 0; // Vynulování přehrávání
            musicIcon.classList.remove("fa-pause");
            musicIcon.classList.add("fa-play");
            audioPlaying = false;
        }

        // Úprava hlasitosti
        function adjustVolume(volume) {
            const audioElement = document.getElementById("backgroundAudio");
            audioElement.volume = volume;
        }
    </script>

</head>

<body>
    <!-- Skrytý audio přehrávač -->
    <audio id="backgroundAudio" loop>
        <source src="{% static 'audio/background-music.mp3' %}" type="audio/mpeg">
        <source src="{% static 'audio/background-music.ogg' %}" type="audio/ogg">
        Váš prohlížeč nepodporuje přehrávání audia.
    </audio>

    <!-- Ovládací prvky pro hudbu -->
    <div class="music-controls">
        <!-- Tlačítko přehrávání/pauzy -->
        <button onclick="toggleAudio()">
            <i id="musicIcon" class="fas fa-play"></i>
        </button>

        <!-- Posuvník hlasitosti -->
        <input class="volume-slider" type="range" min="0" max="1" step="0.1" onchange="adjustVolume(this.value)" />

        <!-- Tlačítko pro zastavení hudby -->
        <button onclick="stopAudio()">
            <i class="fas fa-stop"></i>
        </button>
    </div>

    <div class="container-center">
        <div class="user_card text-white">
            <div class="title">
                Hotel Gold Perla Maldives
            </div>

            <div class="form_container">
                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <div class="input-group-append">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" name="username" placeholder="Username..." class="form-control">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                        </div>
                        <input type="password" id="passwordInput" name="password" placeholder="Password..."
                            class="form-control">
                        <div class="input-group-append">
                            <span class="input-group-text toggle-password" onclick="togglePasswordVisibility()">
                                <i id="togglePasswordIcon" class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-3 login_container">
                        <input class="btn login_btn" type="submit" value="Login">
                    </div>
                </form>
            </div>

            {% for message in messages %}
            <p id="messages">{{ message }}</p>
            {% endfor %}

            <div class="mt-4" style="color: #FFFF00;">
                <div class="d-flex justify-content-center links">
                    Don't have an account? <a href="{% url 'register' %}" class="ml-2"
                        style="color: #FFFFFF;">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
