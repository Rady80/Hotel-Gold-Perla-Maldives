<!-- 
Hlavní kontejner pro správu skladových položek.
Obsahuje seznam položek, filtrovací formulář, možnost upravit množství a přidat nové položky.
-->

<div class="container py-5">
    <!-- Hlavička tabulky -->
    <div class="table-header row">
        <div class="col-sm-12 col-md-12 col-lg-4 mb-4">
            <h2>Sklad</h2>
        </div>
    </div>

    <!-- Tabulka se seznamem skladových položek -->
    <table class="table table-hover table-striped">
        <thead class="bg-secondary text-white">
            <tr>
                <!-- Formulář pro filtrování -->
                <form action="" method="POST">
                    {% csrf_token %}
                    <th>
                        ID položky
                        <input type="number" name="id" value="{{ id }}" class="form-control border border-secondary">
                    </th>
                    <th>
                        Název položky
                        <input type="text" name="name" value="{{ name }}" class="form-control border border-secondary">
                    </th>
                    <th>
                        Typ
                        <input type="text" name="type" value="{{ type }}" class="form-control border border-secondary">
                    </th>
                    <th>Množství</th>
                    <th colspan="3">
                        <button type="submit" name="filter" class="btn btn-warning w-100">Filtrovat</button>
                    </th>
                </form>
            </tr>
        </thead>
        <tbody>
            <!-- Iterace přes seznam položek ve skladu -->
            {% for s in storage %}
            <tr>
                <!-- Zobrazení ID, názvu a typu položky -->
                <td>{{ s.id }}</td>
                <td>{{ s.itemName }}</td>
                <td>{{ s.itemType }}</td>

                <!-- Formulář pro úpravu množství položky -->
                <form action="" method="POST">
                    {% csrf_token %}
                    <td>
                        <input type="number" step="1" value="{{ s.quantitiy }}" name="quantitiy" class="form-control">
                    </td>
                    <td>
                        <input type="hidden" value="{{ s.id }}" name="id">
                    </td>
                    <th>
                        <button type="submit" class="btn btn-sm btn-primary w-100" name="save">Uložit</button>
                    </th>
                    <!-- Možnost smazání položky (pouze pro manažera nebo administrátora) -->
                    {% if role == "manager" or role == "admin" %}
                    <th>
                        <a href="{% url 'deleteStorage' s.id %}" class="btn btn-sm btn-danger px-3">Smazat</a>
                    </th>
                    {% endif %}
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Sekce pro přidání nové položky -->
    <div class="newItem my-5 border-top pt-3">
        <h3>Přidat položku</h3>
        <form action="" method="POST">
            {% csrf_token %}

            <!-- Pole pro název položky -->
            <div class="form-group pt-3">
                <label for="id_item_name"><b>Název položky</b></label>
                <input type="text" class="form-control border border-secondary" id="id_item_name" name="itemName" required>
            </div>

            <!-- Pole pro typ položky -->
            <div class="form-group pt-3">
                <label for="id_item_type">Typ položky</label>
                <select class="form-control" name="itemType" id="id_item_type" required>
                    <option value="" selected>---------</option>
                    <option value="Kitchen">Kuchyně</option>
                    <option value="Cleaning">Úklid</option>
                    <option value="Electronic">Elektronika</option>
                    <option value="Textile">Textilie</option>
                    <option value="Other">Ostatní</option>
                </select>
            </div>

            <!-- Pole pro množství položky -->
            <div class="form-group">
                <label for="item-quantity"><b>Množství položky</b></label>
                <input type="number" min="1" class="form-control border border-secondary" name="quantitiy" id="item-quantity" required>
            </div>

            <!-- Tlačítko pro přidání položky -->
            <button type="submit" class="btn btn-primary px-5 float-right mb-5" name="add">Přidat</button>
        </form>
    </div>
</div>
