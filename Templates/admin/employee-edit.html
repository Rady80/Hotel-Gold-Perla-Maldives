{% extends '../index.html' %}

{% block content %}
    <!-- Sekce pro úpravu zaměstnance -->
    <div class="container mt-4">
        <h2 class="text-primary">Úprava zaměstnance</h2>

        <!-- Formulář pro editaci zaměstnance -->
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Uživatelské jméno</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ employee.user.username }}" readonly>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ employee.user.email }}">
            </div>
            <div class="mb-3">
                <label for="phoneNumber" class="form-label">Telefonní číslo</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" value="{{ employee.phoneNumber }}">
            </div>
            <div class="mb-3">
                <label for="salary" class="form-label">Plat</label>
                <input type="number" class="form-control" id="salary" name="salary" value="{{ employee.salary }}" step="0.01">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role">
                    <option value="manager" {% if employee.user.groups.first.name == "manager" %}selected{% endif %}>Manager</option>
                    <option value="receptionist" {% if employee.user.groups.first.name == "receptionist" %}selected{% endif %}>Recepční</option>
                    <option value="staff" {% if employee.user.groups.first.name == "staff" %}selected{% endif %}>Zaměstnanec</option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Uložit změny</button>
                <a href="{% url 'employees' %}" class="btn btn-secondary">Zrušit</a>
            </div>
        </form>
    </div>
{% endblock %}
