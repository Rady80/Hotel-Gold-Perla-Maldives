<!DOCTYPE html>
<html lang="cs"> <!-- Nastaveno na češtinu -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Úprava jídelního menu</title>
    <!-- Bootstrap pro styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Hlavní kontejner -->
    <div class="container mt-5">
        <h1 class="mb-4">Úprava jídelního menu</h1>
        <!-- Formulář pro úpravu jídelního menu -->
        <form method="post">
            {% csrf_token %} <!-- Ochrana proti CSRF útokům -->
            {{ form.as_p }} <!-- Automatické vykreslení formuláře -->
            <button type="submit" class="btn btn-primary">Odeslat</button> <!-- Tlačítko odeslání -->
        </form>
    </div>
</body>
</html>
