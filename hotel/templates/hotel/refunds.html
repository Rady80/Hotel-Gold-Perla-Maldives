<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seznam refundací</title>
</head>
<body>
    <h1>Seznam refundací</h1>
    <ul>
        {% for refund in refunds %}
            <li>{{ refund }}</li>
        {% empty %}
            <li>Žádné refundace nebyly nalezeny.</li>
        {% endfor %}
    </ul>
</body>
</html>
