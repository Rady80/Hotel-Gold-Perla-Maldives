<!-- authorized-events.html -->
<table class="table table-striped mt-4">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Typ události</th>
            <th>Místo</th>
            <th>Začátek</th>
            <th>Konec</th>
            <th>Akce</th>
        </tr>
    </thead>
    <tbody>
        {% for event in events %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ event.eventType }}</td>
            <td>{{ event.location }}</td>
            <td>{{ event.startDate }}</td>
            <td>{{ event.endDate }}</td>
            <td>
                <a href="{% url 'event-profile' event.id %}" class="btn btn-info btn-sm">Detail</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6" class="text-center">Žádné události k zobrazení.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
